name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Pinned to 22 to match the committed package-lock.json (npm 10).
          # Keep in sync with .nvmrc — regenerating the lockfile under a
          # different npm major (e.g. node 24 / npm 11) drifts `npm ci`.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
